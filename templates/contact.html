{% extends 'base.html' %}
<head>
  <link rel="canonical" href="https://takhfifclass.ir/contact" />
</head>
{% block content %}
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="message" style="margin-top: 6em; text-align: right;">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<div class="ui container" style="margin-top: 100px; direction: rtl; text-align: right;">

  <h2 class="ui teal header">تماس با ما</h2>

  <form class="ui form" method="POST" action="{{ url_for('contact') }}">
    <div class="field">
      <label>نام و نام خانوادگی</label>
      <input type="text" name="name" placeholder="نام کامل شما" required>
    </div>
    <div class="field">
      <label>ایمیل</label>
      <input type="email" name="email" placeholder="example@example.com" required>
    </div>
    <div class="field">
      <label>پیام شما</label>
      <textarea name="message" placeholder="پیام خود را اینجا بنویسید..." rows="5" required></textarea>
    </div>
    <div class="ui center aligned container" style="margin-bottom: 5em;">
    <button class="ui teal button" type="submit">ارسال</button>
</div>

  </form>

</div>
{% endblock %}
