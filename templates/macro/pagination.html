{% macro pagination(page, pages, last, page_urls) %}
{% if pages|length > 1 %}
    <center>
        <div class="ui secondary pagination menu">
            {% if 1 not in pages %}
                <a class="item" href="{{ page_urls[1] }}">
                    <span style="color:#4e473d;">
                        <i class="angle double right icon"></i>
                    </span>
                </a>
            {% endif %}

            {% for i in pages %}
                <a class="{{ 'active' if i == page else '' }} item" href="{{ page_urls[i] }}">
                    <span style="{{ 'font-weight: bold;' if i == page else '' }} color:#4e473d;">{{ i|persian }}</span>
                </a>
            {% endfor %}

            {% if last not in pages %}
                <a class="item" href="{{ page_urls[last] }}">
                    <span style="color:#4e473d;">
                        <i class="angle double left icon"></i>
                    </span>
                </a>
            {% endif %}
        </div>
    </center>
{% endif %}
{% endmacro %}
