
services:
  web:
    build: .
    ports:
      - "45123:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/vahid
    depends_on:
      - mongodb
    volumes:
      - .:/app
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "427017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
