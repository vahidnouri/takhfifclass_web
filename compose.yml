
services:
  web:
    build: .
    ports:
      - "5111:5000"
    restart: unless-stopped
    environment:
      FLASK_APP: ${FLASK_APP}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      # Compose will substitute the variables defined in .env here:
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=${AUTH_SOURCE}"
    volumes:
      - .:/app
    networks:
      - cloudflare


networks:
  cloudflare:
    external: true
